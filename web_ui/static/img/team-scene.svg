<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="Сцена команды AI Team System: кто кому передаёт работу">
  <title>Сцена: команда AI Team System</title>
  <desc>Схема из семи ролей: TeamLead распределяет задачи, Architect проектирует, Backend, Frontend и DevOps делают, Tester проверяет, Documentalist описывает. Стрелки — передача работы, пунктир — возврат на доработку.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8cff"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb86b"/>
    </marker>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="760" fill="#0f1115"/>
  <text x="40" y="56" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600">Сцена: команда AI Team System</text>
  <text x="40" y="84" fill="#8b93a7" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Кто чем занимается и как зависит от других. Стрелки — передача работы, пунктир — возврат на доработку.</text>

  <!-- стрелки -->
  <g fill="none" stroke="#7c8cff" stroke-width="2" marker-end="url(#arrow)" opacity="0.85">
    <path d="M 250 337 L 265 337 L 265 177 L 300 177"/>
    <path d="M 250 337 L 300 337"/>
    <path d="M 250 337 L 265 337 L 265 457 L 300 457"/>
    <path d="M 250 337 L 265 337 L 265 597 L 300 597"/>
    <path d="M 490 177 L 490 317 L 300 317" marker-end="url(#arrow)"/>
    <path d="M 490 177 L 505 177 L 505 457 L 300 457"/>
    <path d="M 490 177 L 520 177 L 520 597 L 300 597"/>
    <path d="M 490 317 L 580 317 L 580 337 L 640 337"/>
    <path d="M 490 457 L 580 457 L 580 337 L 640 337"/>
    <path d="M 490 597 L 610 597 L 610 373 L 640 373"/>
    <path d="M 830 337 L 810 337 L 810 457 L 700 457 L 700 373 L 660 373"/>
    <path d="M 830 337 L 940 337" />
  </g>
  <path d="M 640 305 L 560 305 L 560 288 L 490 288" fill="none" stroke="#ffb86b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-back)" opacity="0.9"/>

  <!-- подписи к стрелкам -->
  <g fill="#8b93a7" font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="272" y="240">задача</text>
    <text x="512" y="300">план</text>
    <text x="586" y="330">код</text>
    <text x="700" y="470">правки</text>
    <text x="866" y="328">описание проекта</text>
  </g>

  <!-- TeamLead -->
  <g>
    <rect x="40" y="300" width="210" height="76" rx="14" fill="url(#lead)" stroke="#6d7cff" stroke-width="1.5"/>
    <text x="60" y="330" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600">TeamLead</text>
    <text x="60" y="352" fill="#d5d9ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">координирует и распределяет</text>
    <text x="60" y="368" fill="#d5d9ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">задачи между агентами</text>
  </g>

  <!-- Architect -->
  <g>
    <rect x="300" y="140" width="190" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="318" y="170" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Architect</text>
    <text x="318" y="192" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">решает, как устроен проект</text>
  </g>

  <!-- Backend -->
  <g>
    <rect x="300" y="280" width="190" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="318" y="310" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Backend</text>
    <text x="318" y="332" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">логика, данные, API</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="300" y="420" width="190" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="318" y="450" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Frontend</text>
    <text x="318" y="472" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">интерфейс и вёрстка</text>
  </g>

  <!-- DevOps -->
  <g>
    <rect x="300" y="560" width="190" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="318" y="590" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">DevOps</text>
    <text x="318" y="612" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">запуск, окружение, сборка</text>
  </g>

  <!-- Tester -->
  <g>
    <rect x="640" y="300" width="190" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="658" y="330" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Tester</text>
    <text x="658" y="352" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">проверяет, что всё работает</text>
  </g>

  <!-- Documentalist -->
  <g>
    <rect x="940" y="300" width="200" height="74" rx="14" fill="#1b2130" stroke="#39415a"/>
    <text x="958" y="330" fill="#e6e8ef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Documentalist</text>
    <text x="958" y="352" fill="#98a0b5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">объясняет проект человеку</text>
  </g>

  <!-- легенда -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="40" y="668" width="1100" height="56" rx="12" fill="#151a23" stroke="#262d3d"/>
    <line x1="62" y1="696" x2="122" y2="696" stroke="#7c8cff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="132" y="701" fill="#98a0b5">передача работы: сначала приходит план, потом код, потом проверка</text>
    <line x1="660" y1="696" x2="720" y2="696" stroke="#ffb86b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-back)"/>
    <text x="730" y="701" fill="#98a0b5">возврат на доработку: тесты нашли проблему</text>
  </g>
</svg>
